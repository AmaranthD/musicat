[project]
name = "musicat"
version = "0.1.0"
description = "Player de música local com gatinhos dançantes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "mutagen>=1.47",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
musicat = [
    "static/*.html",
    "static/css/*",
    "static/js/*",
    "static/cats/*",
    "static/backgrounds/*",
    "static/vendor/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
