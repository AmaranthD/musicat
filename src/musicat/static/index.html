<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Musicat</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand">Musicat</h1>
      <p class="tagline">Arraste suas músicas para cá</p>
    </header>

    <main class="layout">
      <section class="stage" aria-label="Palco">
        <p class="stage__hint">Os gatinhos chegam na próxima fatia</p>
      </section>

      <section class="player" aria-label="Player">
        <div class="player__now">
          <div class="player__cover" aria-hidden="true"></div>
          <div class="player__meta">
            <span class="player__title">Nada tocando</span>
            <span class="player__artist">—</span>
          </div>
        </div>
      </section>

      <section class="library" aria-label="Biblioteca">
        <div class="panel__head">
          <h2 class="panel__title">Biblioteca</h2>
          <span class="panel__count" id="library-count"></span>
          <input
            type="search"
            class="search"
            id="search"
            placeholder="Buscar título, artista, álbum…"
            aria-label="Buscar na biblioteca"
          />
          <select class="sort" id="sort" aria-label="Ordenar por">
            <option value="imported_at">Recentes</option>
            <option value="title">Título</option>
            <option value="artist">Artista</option>
            <option value="duration">Duração</option>
          </select>
        </div>
        <ul class="track-list" id="track-list"></ul>
        <p class="panel__empty" id="library-empty">Nenhuma faixa ainda. Arraste arquivos de música.</p>
        <div class="unrecognized" id="unrecognized" hidden>
          <h3 class="unrecognized__title">Itens não reconhecidos</h3>
          <ul class="unrecognized__list" id="unrecognized-list"></ul>
        </div>
      </section>
    </main>

    <div class="dropzone" id="dropzone" hidden>
      <div class="dropzone__box">
        <span class="dropzone__paw">🐾</span>
        <p class="dropzone__text">Solte para importar</p>
      </div>
    </div>

    <div class="progress" id="progress" hidden>
      <div class="progress__bar" id="progress-bar"></div>
      <span class="progress__label" id="progress-label">Importando…</span>
    </div>

    <script src="/static/js/app.js" type="module"></script>
  </body>
</html>
